<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamChat Overlay — Pro Gamer HUD Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Press+Start+2P&family=Rajdhani:wght@500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  /* ═══════════════════════════════════════════════════════════
     01. BASE VARIABLES & THEME ENGINE
  ═══════════════════════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #00f0ff;
    --accent2: #ff007f;
    --accent3: #fcee0a;
    --glow: rgba(0, 240, 255, 0.5);
    --glow2: rgba(255, 0, 127, 0.4);
    --card-opacity: 0.90;
    --msg-bg: rgba(6, 9, 22, var(--card-opacity));
    --msg-border: rgba(0, 240, 255, 0.28);
    --card-border-width: 1px;
    --card-border-style: solid;
    --card-clip: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    --avatar-clip: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
    --border-radius: 0px;
    --font-family: 'Rajdhani', sans-serif;
    --username-font: 'Rajdhani', sans-serif;
    --username-shadow: none;
    --font-size: 14px;
    --text-color: #f1f5f9;
    --text-sub: #94a3b8;
    --text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    --max-width: 390px;
    --highlight-border: #facc15;
    --highlight-glow: rgba(250, 204, 21, 0.65);
    --card-filter: none;
    --emote-size: 26px;
    --badge-size: 18px;
    --line-height: 1.45;
  }

  /* ═══════════════════════════════════════════════════════════
     02. 10 AUTHENTIC PRO GAMER HUD THEMES
  ═══════════════════════════════════════════════════════════ */

  /* 1. NEON / CYBERPUNK 2077 — Neo-Tokyo Cyberpunk with CRT scanlines & chromatic glow */
  body.theme-neon, body.theme-cyberpunk {
    --accent: #00f0ff; --accent2: #ff007f; --accent3: #fcee0a;
    --glow: rgba(0, 240, 255, 0.65); --glow2: rgba(255, 0, 127, 0.45);
    --msg-bg: rgba(6, 8, 22, var(--card-opacity));
    --msg-border: rgba(0, 240, 255, 0.35);
    --card-clip: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    --font-family: 'Chakra Petch', sans-serif;
    --username-font: 'Chakra Petch', sans-serif;
    --username-shadow: 0 0 8px #00f0ff, 0 0 18px rgba(255, 0, 127, 0.4);
  }
  body.theme-neon .msg::before, body.theme-cyberpunk .msg::before {
    background: repeating-linear-gradient(0deg, rgba(0, 240, 255, 0.03) 0px, rgba(0, 240, 255, 0.03) 1px, transparent 1px, transparent 4px);
  }

  /* 2. VALORANT / TACTICAL — Sharp 45° chamfers, agent killfeed typography, tactical amber */
  body.theme-valorant, body.theme-tactical {
    --accent: #ff4655; --accent2: #ece8e1; --accent3: #0f1923;
    --glow: rgba(255, 70, 85, 0.55); --glow2: rgba(236, 232, 225, 0.3);
    --msg-bg: rgba(15, 25, 35, var(--card-opacity));
    --msg-border: rgba(255, 70, 85, 0.35);
    --card-clip: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
    --avatar-clip: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%);
    --font-family: 'Rajdhani', sans-serif;
    --username-font: 'Rajdhani', sans-serif;
  }
  body.theme-valorant .msg { border-right: 2px solid rgba(255, 70, 85, 0.3); }

  /* 3. STEALTH / MINIMAL — OLED high-contrast distraction-free esports (Shroud/Tarik) */
  body.theme-stealth, body.theme-minimal {
    --accent: #ffffff; --accent2: #a1a1aa; --accent3: #71717a;
    --glow: transparent; --glow2: transparent;
    --msg-bg: rgba(9, 10, 14, var(--card-opacity));
    --msg-border: rgba(255, 255, 255, 0.12);
    --card-clip: none;
    --avatar-clip: none;
    --border-radius: 6px;
    --font-family: 'Inter', sans-serif;
    --username-font: 'Inter', sans-serif;
    --text-shadow: none;
  }

  /* 4. FIRE / MAGMA — Molten flame, pulsing ember glow, Apex champion vibes */
  body.theme-fire, body.theme-magma {
    --accent: #ff3700; --accent2: #ffaa00; --accent3: #ff6600;
    --glow: rgba(255, 55, 0, 0.7); --glow2: rgba(255, 170, 0, 0.5);
    --msg-bg: rgba(22, 6, 4, var(--card-opacity));
    --msg-border: rgba(255, 85, 0, 0.35);
    --card-clip: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    --font-family: 'Rajdhani', sans-serif;
    --username-font: 'Rajdhani', sans-serif;
  }
  body.theme-fire .msg, body.theme-magma .msg {
    animation: fireEmber 3.5s ease-in-out 3 forwards;
  }
  @keyframes fireEmber {
    0%   { border-left-color: #ff3700; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 20px rgba(255,55,0,0.25); }
    50%  { border-left-color: #ffaa00; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 26px rgba(255,170,0,0.4); }
    100% { border-left-color: #ff2200; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 22px rgba(255,34,0,0.3); }
  }

  /* 5. CYBER / MATRIX — Phosphor green terminal, ASCII dashed box, blinking cursor */
  body.theme-cyber, body.theme-matrix {
    --accent: #00ff66; --accent2: #00f0ff; --accent3: #004d1a;
    --glow: rgba(0, 255, 102, 0.55); --glow2: rgba(0, 240, 255, 0.35);
    --msg-bg: rgba(2, 14, 8, var(--card-opacity));
    --msg-border: rgba(0, 255, 102, 0.38);
    --card-border-style: dashed;
    --card-clip: none;
    --avatar-clip: none;
    --border-radius: 0px;
    --font-family: 'Space Mono', monospace;
    --username-font: 'Space Mono', monospace;
    --text-color: #d1fae5;
  }

  /* 6. SYNTHWAVE / SUNSET — Outrun 80s gradient, retro wave horizon glow */
  body.theme-synthwave, body.theme-sunset {
    --accent: #f43f5e; --accent2: #fbbf24; --accent3: #a855f7;
    --glow: rgba(244, 63, 94, 0.65); --glow2: rgba(251, 191, 36, 0.45);
    --msg-bg: rgba(20, 8, 22, var(--card-opacity));
    --msg-border: rgba(244, 63, 94, 0.35);
    --card-clip: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    --font-family: 'Orbitron', sans-serif;
    --username-font: 'Orbitron', sans-serif;
  }

  /* 7. GLASS / FROST — 24px Frosted Glassmorphism, liquid clean specular inner highlight */
  body.theme-glass, body.theme-frost {
    --accent: #ffffff; --accent2: #94a3b8; --accent3: #38bdf8;
    --glow: transparent; --glow2: transparent;
    --msg-bg: rgba(255, 255, 255, var(--card-opacity, 0.1));
    --msg-border: rgba(255, 255, 255, 0.28);
    --card-clip: none;
    --avatar-clip: none;
    --border-radius: 12px;
    --card-filter: blur(24px) saturate(1.8);
    --font-family: 'Inter', sans-serif;
    --username-font: 'Inter', sans-serif;
  }

  /* 8. ROSE / KAWAII — Sakura Anime, pastel soft pill shape, bounce pops */
  body.theme-rose, body.theme-kawaii {
    --accent: #fb7185; --accent2: #f43f5e; --accent3: #fda4af;
    --glow: rgba(251, 113, 133, 0.5); --glow2: rgba(244, 63, 94, 0.35);
    --msg-bg: rgba(28, 10, 20, var(--card-opacity));
    --msg-border: rgba(251, 113, 133, 0.32);
    --card-clip: none;
    --avatar-clip: none;
    --border-radius: 16px;
    --font-family: 'Inter', sans-serif;
    --username-font: 'Inter', sans-serif;
  }

  /* 9. OCEAN / HEXTECH — Arcane rune glow, deep sea wave gradient */
  body.theme-ocean, body.theme-hextech {
    --accent: #0ea5e9; --accent2: #14b8a6; --accent3: #38bdf8;
    --glow: rgba(14, 165, 233, 0.5); --glow2: rgba(20, 184, 166, 0.4);
    --msg-bg: rgba(4, 16, 30, var(--card-opacity));
    --msg-border: rgba(14, 165, 233, 0.32);
    --card-clip: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    --font-family: 'Rajdhani', sans-serif;
    --username-font: 'Rajdhani', sans-serif;
  }

  /* 10. FLOATING / PURE — 0% opacity, pure high-contrast floating text for extreme readability */
  body.theme-floating, body.pure-floating {
    --card-opacity: 0;
  }
  body.theme-floating .msg, body.pure-floating .msg {
    background: transparent !important;
    border-top: none !important;
    border-right: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    padding: 4px 6px;
    border-left: 3px solid var(--user-color, var(--accent)) !important;
  }

  /* ═══════════════════════════════════════════════════════════
     03. VIEWPORT & CONTAINER LAYOUT
  ═══════════════════════════════════════════════════════════ */
  html, body {
    background: transparent !important;
    overflow: hidden;
    font-family: var(--font-family);
    font-size: var(--font-size);
    color: var(--text-color);
    width: 100vw;
    height: 100vh;
    user-select: none;
  }

  /* High-Contrast Text Stroke / Drop Outline Mode */
  body.has-text-stroke .msg-text,
  body.has-text-stroke .username,
  body.has-text-stroke .timestamp,
  body.has-text-stroke .platform-tag {
    text-shadow:
      -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000,
      -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000,
      -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000,
      0 3px 8px rgba(0, 0, 0, 0.95);
  }

  #chat-wrap {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: var(--max-width);
    max-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column-reverse; /* Default: Bottom-Up */
    gap: 6px;
    overflow: hidden;
    pointer-events: auto;
    contain: layout style;
  }

  /* Dock Positioning */
  body.pos-left #chat-wrap { right: auto; left: 16px; }
  body.pos-top-left #chat-wrap { right: auto; left: 16px; bottom: auto; top: 16px; flex-direction: column; }
  body.pos-top-right #chat-wrap { right: 16px; bottom: auto; top: 16px; flex-direction: column; }
  body.dir-down #chat-wrap { flex-direction: column; }


  /* ═══════════════════════════════════════════════════════════
     04. HUD MESSAGE CARD DESIGN & SHIMMER
  ═══════════════════════════════════════════════════════════ */
  .msg {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    background: var(--msg-bg);
    border: var(--card-border-width) var(--card-border-style) var(--msg-border);
    border-left: 3.5px solid var(--user-color, var(--accent));
    clip-path: var(--card-clip);
    border-radius: var(--border-radius, 0px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.09),
      0 6px 28px rgba(0,0,0,0.65);
    max-width: var(--max-width);
    flex-shrink: 0;
    will-change: transform, opacity;
    transition: opacity 0.35s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: hidden;
  }

  body.theme-glass .msg, body.theme-frost .msg {
    backdrop-filter: var(--card-filter);
    -webkit-backdrop-filter: var(--card-filter);
  }

  /* Mention Highlight */
  .msg.highlighted {
    border-left-color: var(--highlight-border) !important;
    border-color: rgba(250, 204, 21, 0.55) !important;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.25),
      0 0 24px var(--highlight-glow),
      0 8px 32px rgba(0,0,0,0.85) !important;
    animation: highlightPulse 1.8s ease-in-out 3 forwards;
  }
  @keyframes highlightPulse {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 0 18px var(--highlight-glow), 0 8px 32px rgba(0,0,0,0.85); }
    50%      { box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 0 28px var(--highlight-glow), 0 8px 36px rgba(0,0,0,0.95); }
  }



  /* ═══════════════════════════════════════════════════════════
     05. AVATAR & PLATFORM BADGES
  ═══════════════════════════════════════════════════════════ */
  body.hide-avatars .avatar { display: none !important; }
  body.hide-badges .badge, body.hide-badges .platform-tag { display: none !important; }
  body.hide-timestamps .timestamp { display: none !important; }

  .avatar {
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    clip-path: var(--avatar-clip);
    border-radius: var(--border-radius, 0px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-family);
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.18);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .avatar .avatar-mark {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 12px;
    height: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.9);
    border-top: 1px solid rgba(255,255,255,0.25);
    border-left: 1px solid rgba(255,255,255,0.25);
    z-index: 2;
  }
  .avatar .avatar-mark svg {
    width: 8px;
    height: 8px;
    display: block;
  }

  /* ═══════════════════════════════════════════════════════════
     06. MESSAGE HEADER, BADGES & USERNAME
  ═══════════════════════════════════════════════════════════ */
  .msg-content {
    flex: 1;
    min-width: 0;
  }

  .msg-header {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 4px;
    padding-bottom: 3px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }

  .timestamp {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text-sub);
    opacity: 0.85;
  }

  /* Platform Tag: [TW] [YT] [KI] */
  .platform-tag {
    font-family: 'Space Mono', monospace;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 1px 4px;
    border-radius: 2px;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .platform-tag.twitch  { background: rgba(145, 71, 255, 0.28); color: #c084fc; border: 1px solid rgba(145, 71, 255, 0.45); }
  .platform-tag.youtube { background: rgba(255, 0, 0, 0.24);     color: #f87171; border: 1px solid rgba(255, 0, 0, 0.45); }
  .platform-tag.kick    { background: rgba(83, 185, 79, 0.24);   color: #4ade80; border: 1px solid rgba(83, 185, 79, 0.45); }

  /* Username: ALL CAPS, tracked letter-spacing */
  .username {
    font-family: var(--username-font, var(--font-family));
    font-weight: 700;
    font-size: calc(var(--font-size) + 1px);
    color: var(--user-color, var(--accent));
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1.15;
    text-shadow: var(--username-shadow, none);
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--badge-size);
    height: var(--badge-size);
    border-radius: 3px;
    flex-shrink: 0;
  }
  .badge svg { width: 12px; height: 12px; }
  .badge-broadcaster { background: #ef4444; }
  .badge-moderator   { background: #10b981; }
  .badge-subscriber  { background: #8b5cf6; }
  .badge-vip         { background: #f59e0b; }
  .badge-partner     { background: #4f46e5; }
  .badge-prime       { background: #00a8ff; }
  .badge-verified    { background: #1d9bf0; }
  .badge-yt-member   { background: #ff0000; }
  .badge-bits        { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; font-size: 8px; font-weight: 700; font-family: 'Space Mono', monospace; padding: 0 3px; width: auto; min-width: var(--badge-size); }

  /* Message Text */
  .msg-text {
    color: var(--text-color);
    font-size: var(--font-size);
    line-height: var(--line-height);
    word-break: break-word;
    overflow-wrap: anywhere;
    text-shadow: var(--text-shadow);
  }
  .msg-text.is-action {
    font-style: italic;
    color: var(--user-color, var(--accent));
  }

  /* Emotes (Twitch, 7TV, BTTV, FFZ, Native) */
  .msg-text img.emote {
    height: var(--emote-size);
    max-height: calc(var(--emote-size) * 1.3);
    vertical-align: -5px;
    display: inline-block;
    margin: 0 2px;
    object-fit: contain;
    image-rendering: auto;
  }

  /* BigEmote scaling (1-3 emotes only in message) */
  .msg-text.big-emotes img.emote {
    height: calc(var(--emote-size) * 1.8) !important;
    max-height: calc(var(--emote-size) * 2.2) !important;
    margin: 3px 4px !important;
  }

  .msg-text .chat-link {
    color: #38bdf8;
    text-decoration: none;
    border-bottom: 1px dashed rgba(56, 189, 248, 0.5);
    font-family: 'Space Mono', monospace;
    font-size: 0.92em;
  }
  .msg-text .chat-link:hover { color: #bae6fd; border-bottom-style: solid; }
  .msg-text .mention {
    color: #fde047;
    background: rgba(250, 204, 21, 0.15);
    border: 1px solid rgba(250, 204, 21, 0.35);
    padding: 0 4px;
    border-radius: 3px;
    font-weight: 700;
  }

  .platform-icon {
    position: absolute;
    top: 8px; right: 8px;
    opacity: 0.14;
    width: 14px; height: 14px;
  }

  /* ═══════════════════════════════════════════════════════════
     07. EPIC EVENT CARDS (SUBS, RAIDS, BITS, SUPERCHATS)
  ═══════════════════════════════════════════════════════════ */
  .msg.event {
    background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(0,0,0,0.65)), var(--msg-bg);
    border-color: rgba(255,255,255,0.25);
    border-left-width: 4px;
    animation: eventBannerIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both, eventPulseBorder 2.5s 0.4s 4 ease-in-out !important;
  }
  @keyframes eventBannerIn {
    0%   { transform: translateY(-16px) scale3d(0.95, 0.95, 1); opacity: 0; }
    50%  { transform: translateY(2px) scale3d(1.02, 1.02, 1); opacity: 0.95; }
    100% { transform: translateY(0) scale3d(1, 1, 1); opacity: 1; }
  }
  @keyframes eventPulseBorder {
    0%, 100% { border-left-color: var(--accent); }
    50%      { border-left-color: var(--accent2); }
  }

  .event-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .event-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 9px;
    text-transform: uppercase;
    color: var(--accent2);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 2px 6px;
    clip-path: var(--card-clip);
    border-radius: var(--border-radius, 3px);
  }
  .event-title {
    font-family: var(--font-family);
    font-weight: 700;
    font-size: calc(var(--font-size) + 2px);
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-shadow: 0 0 12px var(--glow);
  }
  .event-subtitle {
    color: var(--text-color);
    font-weight: 600;
    line-height: 1.4;
  }
  .event-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 4px;
  }
  .event-amount {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 2px 8px;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    clip-path: var(--card-clip);
    border-radius: var(--border-radius, 3px);
    box-shadow: 0 0 10px var(--glow);
  }
  .event-icon { font-size: 20px; line-height: 1; vertical-align: middle; }

  /* YouTube SuperChat Tier Colors */
  .msg.event.superchat-tier-red    { border-left-color: #e62117 !important; }
  .msg.event.superchat-tier-magenta{ border-left-color: #c2185b !important; }
  .msg.event.superchat-tier-orange { border-left-color: #e65100 !important; }

function hexToRgb(hex) {
  let c = hex.replace(/^#/, '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const num = parseInt(c, 16);
  return Number.isNaN(num) ? null : { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

function setAccentColors(accent, accent2) {
  const root = document.documentElement;
  if (accent) {
    const c = accent.startsWith('#') ? accent : `#${accent}`;
    root.style.setProperty('--accent', c);
    const rgb = hexToRgb(c);
    if (rgb) {

      root.style.setProperty('--msg-border', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.35)`);

    root.style.setProperty('--accent2', c);

    if (rgb) {
      root.style.setProperty('--glow2', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.45)`);
    }
  }
}

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = Math.imul(31, h) + str.charCodeAt(i) | 0;
  return h;
}

function getColor(name) {
  if (!userColors[name]) userColors[name] = PALETTE[Math.abs(hashCode(name)) % PALETTE.length];
  return userColors[name];
}

function escHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escAttr(value) {
  return escHtml(value).replace(/`/g, '&#96;');
}

}

  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

  mark.className = 'avatar-mark';
  mark.innerHTML = PLATFORM_SVG[platform] || '';
  avatar.appendChild(mark);
  return avatar;
}

let audioContext = null;

function ensureAudioContext() {
  if (!currentSound || currentSoundProfile === 'mute') return null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioContext) {
      audioContext = new AC();
    }
    if (audioContext.state === 'suspended') {
      audioContext.resume().catch(() => {});
    }
    return audioContext;
  } catch {
    return null;
  }
}

function playCue(kind = 'message', overrideProfile = null) {
  const ctx = ensureAudioContext();
  if (!ctx) return;
  if (ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
  }

  const profileName = overrideProfile || currentSoundProfile;
  if (profileName === 'mute') return;

  const isEvent = kind.includes('event');
  const now = ctx.currentTime;

  try {
    const masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(currentSoundVolume * 0.4, now);
    masterGain.connect(ctx.destination);

    if (profileName === 'cyber') {
      // High-tech Dual FM Modulated Synthesizer Blip
      const carrier = ctx.createOscillator();
      const modulator = ctx.createOscillator();
      const modGain = ctx.createGain();
      const gain = ctx.createGain();

      carrier.type = 'sawtooth';
      modulator.type = 'sine';

      const f1 = isEvent ? 880 : 540;
      carrier.frequency.setValueAtTime(f1, now);
      carrier.frequency.exponentialRampToValueAtTime(f1 * 1.6, now + 0.08);

      modulator.frequency.setValueAtTime(isEvent ? 220 : 135, now);
      modGain.gain.setValueAtTime(300, now);
      modGain.gain.exponentialRampToValueAtTime(10, now + 0.1);

      modulator.connect(modGain);
      modGain.connect(carrier.frequency);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.45, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + (isEvent ? 0.2 : 0.11));

      carrier.connect(gain);
      gain.connect(masterGain);

      carrier.start(now);
      modulator.start(now);
      carrier.stop(now + 0.22);
      modulator.stop(now + 0.22);

    } else if (profileName === 'coin') {
      // 8-Bit Nintendo/Arcade Double Arpeggio
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';

      osc.frequency.setValueAtTime(isEvent ? 659.25 : 987.77, now);
      osc.frequency.setValueAtTime(isEvent ? 880.00 : 1318.51, now + 0.07);

      gain.gain.setValueAtTime(0.32, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.26);

    } else if (profileName === 'chime') {
      // Celestial Major Triad Crystal Bell Chord
      const notes = isEvent ? [523.25, 659.25, 783.99, 1046.50] : [880, 1108.73, 1318.51];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.02);

        gain.gain.setValueAtTime(0.001, now + i * 0.02);
        gain.gain.exponentialRampToValueAtTime(0.25 / notes.length, now + i * 0.02 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now + i * 0.02);
        osc.stop(now + 0.38);
      });

    } else if (profileName === 'ping') {
      // Tactical Sub-Bass Sonar Ping (Valorant/Apex style)
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';

      osc.frequency.setValueAtTime(isEvent ? 1300 : 750, now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.12);

      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.16);

    } else if (profileName === 'pop') {
      // Resonant Liquid Bubble Pop
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';

      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(820, now + 0.04);

      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.07);
    }
  } catch {}
}

/* ═══════════════════════════════════════════════════════════
   14. TEXT, EMOTE & BIGEMOTE PARSER
═══════════════════════════════════════════════════════════ */
function renderPlainSegmentWithCustomEmotes(segment) {
  if (!segment) return '';
  const urlPattern = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
  let html = '';
  let cursor = 0;
  let match;

  while ((match = urlPattern.exec(segment)) !== null) {
    html += renderTextAndCustomEmotes(segment.slice(cursor, match.index));
    const rawUrl = match[0];
    const href = rawUrl.startsWith('http') ? rawUrl : `https://${rawUrl}`;
    html += `<a class="chat-link" href="${escAttr(href)}" target="_blank" rel="noopener noreferrer">${escHtml(rawUrl)}</a>`;
    cursor = match.index + rawUrl.length;
  }
  html += renderTextAndCustomEmotes(segment.slice(cursor));
  return html;

  function renderTextAndCustomEmotes(input) {
    if (!input) return '';
    const words = input.split(/(\s+)/);
    let out = '';

    for (const word of words) {
      if (!word) continue;
      if (/^\s+$/.test(word)) {
        out += word;
        continue;
      }

      const emoteData = customEmoteMap.get(word);
      if (emoteData) {
        out += `<img class="emote" src="${escAttr(emoteData.url)}" alt="${escHtml(word)}" title="${escHtml(word)}" loading="lazy" onerror="this.onerror=null; this.replaceWith(document.createTextNode('${escAttr(word)} '));">`;
        continue;
      }

      if (/^@([A-Za-z0-9_]{2,25})([.,!?:;]*)$/.test(word)) {
        const matchMention = word.match(/^@([A-Za-z0-9_]{2,25})([.,!?:;]*)$/);
        out += `<span class="mention">@${escHtml(matchMention[1])}</span>${escHtml(matchMention[2])}`;
        continue;
      }

      out += escHtml(word);
    }
    return out;
  }
}

function renderText(text, emotes = {}) {
  const rawText = String(text || '');
  const ranges = [];

  for (const [id, entries] of Object.entries(emotes || {})) {
    for (const entry of entries || []) {
      const start = Number(entry[0]);
      const end = Number(entry[1]);
      if (Number.isFinite(start) && Number.isFinite(end) && start >= 0 && end >= start && end < rawText.length) {
        ranges.push({ id, start, end });
      }
    }
  }

  if (ranges.length === 0) return renderPlainSegmentWithCustomEmotes(rawText);

  ranges.sort((left, right) => left.start - right.start || left.end - right.end);
  let html = '';
  let cursor = 0;

  for (const range of ranges) {
    if (range.start < cursor) continue;
    html += renderPlainSegmentWithCustomEmotes(rawText.slice(cursor, range.start));
    const emoteText = rawText.slice(range.start, range.end + 1);
    html += `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(range.id)}/default/dark/2.0" alt="${escHtml(emoteText)}" title="${escHtml(emoteText)}" onerror="this.onerror=null; this.replaceWith(document.createTextNode('${escAttr(emoteText)} '));">`;
    cursor = range.end + 1;
  }

  html += renderPlainSegmentWithCustomEmotes(rawText.slice(cursor));
  return html;
}

function isBigEmoteOnly(renderedHtml, rawText) {
  if (!rawText) return false;
  const stripped = renderedHtml.replace(/<img[^>]+>/g, '').replace(/\s+/g, '').trim();
  const imgCount = (renderedHtml.match(/<img[^>]+>/g) || []).length;
  return stripped.length === 0 && imgCount >= 1 && imgCount <= 3;
}

const sourceStates = new Map();

function setSourceState(key, label, text, connected) {
  sourceStates.set(key, { label, text, connected });
  refreshStatus();
}

function refreshStatus() {
  if (!currentShowStatus) return;
  const states = [...sourceStates.values()];
  const connected = states.filter((state) => state.connected);
  const pending = states.filter((state) => !state.connected && state.text);

  let label = 'Connecting…';
  let online = false;

  if (connected.length > 0) {
    label = `${connected.map((state) => state.label).join(' + ')} online`;
    online = true;
    if (pending.length > 0) {
      label += ` • ${pending.map((state) => `${state.label}: ${state.text}`).join(' • ')}`;
    }
  } else if (pending.length > 0) {
    label = `${pending[0].label}: ${pending[0].text}`;
  } else if (DEMO) {
    label = 'DEMO MODE (LIVE)';
    online = true;
  } else if (!hasSource) {
    label = 'No source configured';
  }

  stEl.textContent = label;
  dot.className = `dot${online ? ' on' : ''}`;
}

/* ═══════════════════════════════════════════════════════════
   16. QUEUE ENGINE
═══════════════════════════════════════════════════════════ */

const MESSAGE_QUEUE_LIMIT = 60;
const messageQueue = [];
let flushScheduled = false;
let messageCount = 0;
let lastFlushTime = 0;
const FLUSH_INTERVAL = 40; // ms between batches

function enqueueMessage(message) {
  if (WORD_FILTER.length > 0 && message.text) {
    const lower = message.text.toLowerCase();
    const hasBanned = WORD_FILTER.some(w => lower.includes(w));
    if (hasBanned) return;
  }

  // Drop oldest queued message if queue is full
  if (messageQueue.length >= MESSAGE_QUEUE_LIMIT) {
    messageQueue.shift();
  }
  messageQueue.push(message);

  if (!flushScheduled) {
    flushScheduled = true;
    setTimeout(flushMessages, FLUSH_INTERVAL);
  }
}

function flushMessages() {
  flushScheduled = false;
  const batchSize = Math.min(messageQueue.length, 4);
  if (batchSize === 0) return;

  const isDown = currentChatDir === 'down';

  for (let i = 0; i < batchSize; i++) {
    const msg = messageQueue.shift();
    if (!msg) break;
    try {
      const card = renderMessage(msg);
      if (isDown) {
        wrap.appendChild(card);
      } else {
        wrap.insertBefore(card, wrap.firstChild);
      }
    } catch (e) {
      console.warn('[Overlay] renderMessage error:', e);
    }
  }

  // Prune oldest DOM cards beyond limit
  while (wrap.children.length > currentMaxMsg) {
    const victim = isDown ? wrap.firstChild : wrap.lastChild;
    if (victim) victim.remove();
  }

  if (messageQueue.length > 0) {
    flushScheduled = true;
    setTimeout(flushMessages, FLUSH_INTERVAL);
  }
}

function getCurrentTimestamp() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `[${hh}:${mm}]`;
}

/* ═══════════════════════════════════════════════════════════
   17. MESSAGE CARD BUILDER
═══════════════════════════════════════════════════════════ */
function renderMessage({
  user,
  color,
  text,
  badges = [],
  emotes = {},
  platform = 'twitch',
  isAction = false,
  isEvent = false,
  eventIcon = '',
  avatarUrl = '',
  eventTitle = '',
  eventSubtitle = '',
  eventMeta = [],
  eventAmount = '',
}) {
  const userColor = color || getColor(user || 'user');
  const card = document.createElement('div');
  card.className = `msg ${platform}${isEvent ? ' event' : ''}`;
  card.style.setProperty('--user-color', userColor);
  card.id = `msg-${++messageCount}`;

  // YouTube SuperChat color tier
  if (isEvent && platform === 'youtube' && eventAmount) {
    const numericAmt = Number.parseFloat(String(eventAmount).replace(/[^0-9.]/g, '')) || 5;
    if (numericAmt >= 100) card.classList.add('superchat-tier-red');
    else if (numericAmt >= 50) card.classList.add('superchat-tier-magenta');
    else if (numericAmt >= 20) card.classList.add('superchat-tier-orange');
    else if (numericAmt >= 10) card.classList.add('superchat-tier-yellow');
    else if (numericAmt >= 5) card.classList.add('superchat-tier-green');
    else if (numericAmt >= 2) card.classList.add('superchat-tier-cyan');
    else card.classList.add('superchat-tier-blue');
  }

  // Mention Highlight check
  if (HIGHLIGHT_USER && (
    (text && text.toLowerCase().includes(HIGHLIGHT_USER)) ||
    (user && user.toLowerCase() === HIGHLIGHT_USER)
  )) {
    card.classList.add('highlighted');
  }

  const platformIcon = document.createElement('div');
  platformIcon.className = 'platform-icon';
  platformIcon.innerHTML = PLATFORM_SVG[platform] || '';
  card.appendChild(platformIcon);

  card.appendChild(createAvatarElement({
    user,
    platform,
    avatarUrl: avatarUrl || BRAND_AVATAR,
    color: userColor,
    isEvent,
    icon: eventIcon,
  }));

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (isEvent) {
    const banner = document.createElement('div');
    banner.className = 'event-banner';

    const chip = document.createElement('div');
    chip.className = 'event-chip';
    chip.innerHTML = `${eventIcon ? `<span class="event-icon">${eventIcon}</span>` : ''}<span>${platform === 'youtube' ? 'YouTube' : platform.toUpperCase()}</span>`;
    banner.appendChild(chip);

    const title = document.createElement('div');
    title.className = 'event-title';
    title.textContent = eventTitle || user || 'EVENT';
    banner.appendChild(title);

    content.appendChild(banner);

    const subtitle = document.createElement('div');
    subtitle.className = 'event-subtitle';
    subtitle.textContent = eventSubtitle || text || '';
    content.appendChild(subtitle);

    const meta = document.createElement('div');
    meta.className = 'event-meta';
    (Array.isArray(eventMeta) ? eventMeta : []).forEach((entry) => {
      const pill = document.createElement('span');
      pill.className = entry.kind === 'amount' ? 'event-amount' : '';
      pill.textContent = entry.label;
      meta.appendChild(pill);
    });
    if (eventAmount) {
      const amount = document.createElement('span');
      amount.className = 'event-amount';
      amount.textContent = eventAmount;
      meta.appendChild(amount);
    }
    if (meta.children.length > 0) content.appendChild(meta);
  } else {
    const header = document.createElement('div');
    header.className = 'msg-header';

    // Timestamp
    const timeEl = document.createElement('span');
    timeEl.className = 'timestamp';
    timeEl.textContent = getCurrentTimestamp();
    header.appendChild(timeEl);

    // Platform tag: [TW], [YT], [KI]
    const platformTag = document.createElement('span');
    platformTag.className = `platform-tag ${platform}`;
    platformTag.textContent = platform === 'youtube' ? 'YT' : platform === 'kick' ? 'KI' : 'TW';
    header.appendChild(platformTag);

    // Badges with accessibility
    badges.forEach((badge) => {
      if (badge.startsWith('bits-')) {
        const bitsBadge = document.createElement('span');
        bitsBadge.className = 'badge badge-bits';
        bitsBadge.setAttribute('title', `${badge.replace('bits-', '')} Bits`);
        bitsBadge.setAttribute('aria-label', `${badge.replace('bits-', '')} Bits`);
        bitsBadge.setAttribute('role', 'img');
        bitsBadge.textContent = badge.replace('bits-', '') + '★';
        header.appendChild(bitsBadge);
      } else {
        header.appendChild(makeBadge(badge));
      }
    });

    // Tracked uppercase Username
    const username = document.createElement('span');
    username.className = 'username';
    username.style.color = userColor;
    username.textContent = user || 'User';
    header.appendChild(username);

    content.appendChild(header);

    const textElement = document.createElement('div');
    const rendered = renderText(text, emotes);
    const isBigEmote = isBigEmoteOnly(rendered, text);
    textElement.className = `msg-text${isAction ? ' is-action' : ''}${isBigEmote ? ' big-emotes' : ''}`;
    textElement.innerHTML = rendered;
    content.appendChild(textElement);
  }

  card.appendChild(content);

  // Message Lifetime Expiration (dur=0 means permanent)
  if (currentMsgDur > 0) {
    window.setTimeout(() => {
      card.classList.add('expired');
      window.setTimeout(() => { if (card.parentNode) card.remove(); }, 400);
    }, currentMsgDur);
  }

  playCue(`${platform}:${isEvent ? 'event' : 'message'}`);
  return card;
}

/* ═══════════════════════════════════════════════════════════
   18. TWITCH IRC WEBSOCKET
═══════════════════════════════════════════════════════════ */
function parseIrcTags(rawTags) {
  const tags = {};
  if (!rawTags) return tags;
  rawTags.split(';').forEach((item) => {
    const eqIdx = item.indexOf('=');
    if (eqIdx !== -1) {
      const key = item.slice(0, eqIdx);
      let val = item.slice(eqIdx + 1);
      val = val.replace(/\\s/g, ' ')
               .replace(/\\:/g, ';')
               .replace(/\\r/g, '\r')
               .replace(/\\n/g, '\n')
               .replace(/\\\\/g, '\\');
      tags[key] = val;
    }
  });
  return tags;
}

function handleTwitchMessage(line, ws) {
  if (line.startsWith('PING')) {
    const payload = line.slice(5).trim() || ':tmi.twitch.tv';
    try { ws.send(`PONG ${payload}\r\n`); } catch {}
    return;
  }

  let tags = {};
  let rest = line;

  if (line.startsWith('@')) {
    const splitIndex = line.indexOf(' ');
    if (splitIndex !== -1) {
      const rawTags = line.slice(1, splitIndex);
      rest = line.slice(splitIndex + 1);
      tags = parseIrcTags(rawTags);
    }
  }

  if (rest.includes('PRIVMSG')) {
    const match = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/);
    if (!match) return;
    const user = tags['display-name'] || match[1];
    let message = match[2];
    let isAction = false;

    if (message.startsWith('\x01ACTION ') && message.endsWith('\x01')) {
      isAction = true;
      message = message.slice(8, -1);
    }

    const emotes = {};
    if (tags.emotes) {
      tags.emotes.split('/').forEach((part) => {
        if (!part) return;
        const [id, ranges] = part.split(':');
        if (!id || !ranges) return;
        emotes[id] = ranges.split(',').map((range) => range.split('-').map((value) => Number(value)));
      });
    }

    const badges = [];
    if (tags.badges) {
      if (tags.badges.includes('broadcaster')) badges.push('broadcaster');
      if (tags.badges.includes('moderator')) badges.push('moderator');
      if (tags.badges.includes('subscriber')) badges.push('subscriber');
      if (tags.badges.includes('premium')) badges.push('prime');
      if (tags.badges.includes('partner')) badges.push('partner');
      if (tags.badges.includes('vip')) badges.push('vip');
    }

    if (tags.bits) {
      badges.push(`bits-${tags.bits}`);
    }

    enqueueMessage({ user, color: tags.color || null, text: message, badges, emotes, isAction, platform: 'twitch' });
    return;
  }

  if (rest.includes('USERNOTICE')) {
    const display = tags['display-name'] || 'Streamer';
    const type = tags['msg-id'] || '';
    const viewerCount = tags['msg-param-viewerCount'] || tags['msg-param-viewer-count'] || '';
    const sender = tags['msg-param-sender-login'] || tags['msg-param-sender-name'] || '';
    const recipient = tags['msg-param-recipient-display-name'] || tags['msg-param-recipient-user-name'] || '';
    const months = tags['msg-param-cumulative-months'] || tags['msg-param-streak-months'] || '';
    const bits = tags.bits || tags['msg-param-threshold'] || '';

    const definitions = {
      sub: { icon: '🌟', title: 'New Subscription', subtitle: `${display} subscribed!` },
      resub: { icon: '🔁', title: 'Resubscription', subtitle: months ? `${display} resubscribed for ${months} months!` : `${display} renewed their sub!` },
      subgift: { icon: '🎁', title: 'Gift Sub', subtitle: recipient ? `${sender || display} gifted a sub to ${recipient}!` : `${sender || display} gifted a subscription!` },
      submysterygift: { icon: '🎉', title: 'Community Gift', subtitle: `${display} gifted ${tags['msg-param-mass-gift-count'] || 'multiple'} subs to the community!` },
      raid: { icon: '⚡', title: 'Raid Incoming', subtitle: viewerCount ? `${viewerCount} raiders arrived with ${display}!` : `${display} is raiding!` },
      bits: { icon: '💎', title: 'Cheer', subtitle: bits ? `${display} cheered ${bits} bits!` : `${display} cheered!` },
    };

    const entry = definitions[type];
    if (entry) {
      enqueueMessage({
        user: display,
        platform: 'twitch',
        color: tags.color || null,
        isEvent: true,
        eventIcon: entry.icon,
        eventTitle: entry.title,
        eventSubtitle: (tags['system-msg'] || '').replace(/\\s/g, ' ') || entry.subtitle,
        eventMeta: [
          viewerCount ? { label: `${viewerCount} raiders`, kind: 'count' } : null,
          recipient ? { label: `To: ${recipient}`, kind: 'user' } : null,
        ].filter(Boolean),
        eventAmount: bits ? `${bits} bits` : '',
      });
    }
  }
}

const reconnectTimers = { twitch: null, youtube: null, kick: null };
const retryDelays = { twitch: 1000, youtube: 3000, kick: 2000 };

function scheduleReconnect(source, callback) {
  if (reconnectTimers[source]) clearTimeout(reconnectTimers[source]);
  const delay = retryDelays[source] || 2000;
  retryDelays[source] = Math.min(delay * 1.8, 30000);
  reconnectTimers[source] = setTimeout(callback, delay);
}

function connectTwitch(rawChannel) {
  const channel = (rawChannel || '').toLowerCase().replace(/^#/, '').trim();
  if (!channel) return;

  setSourceState('twitch', 'Twitch', `joining #${channel}…`, false);
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  let pingInterval = null;

  let connectionTimeout = setTimeout(() => {
    setSourceState('twitch', 'Twitch', 'timeout — retrying…', false);
    try { ws.close(); } catch {}
  }, 15000);

  ws.onopen = () => {
    clearTimeout(connectionTimeout);
    const nick = 'justinfan' + Math.floor(10000 + Math.random() * 90000);
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands twitch.tv/membership\r\n');
    ws.send('PASS SCHMOOPIIE\r\n');
    ws.send(`NICK ${nick}\r\n`);
    ws.send(`JOIN #${channel}\r\n`);
    retryDelays.twitch = 1000;
    setSourceState('twitch', 'Twitch', `#${channel}`, true);
    guide.style.display = 'none';

    // Keepalive ping every 45s
    pingInterval = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        try { ws.send('PING :tmi.twitch.tv\r\n'); } catch {}
      }
    }, 45000);
  };

  ws.onmessage = ({ data }) => {
    if (typeof data !== 'string') return;
    const lines = data.split(/\r?\n/);
    for (const line of lines) {
      if (line.trim()) handleTwitchMessage(line.trim(), ws);
    }
  };

  ws.onerror = (err) => {
    clearTimeout(connectionTimeout);
    if (pingInterval) clearInterval(pingInterval);
    console.warn('[Twitch IRC] Error:', err);
    setSourceState('twitch', 'Twitch', 'connection error', false);
  };

  ws.onclose = (ev) => {
    clearTimeout(connectionTimeout);
    if (pingInterval) clearInterval(pingInterval);
    console.warn('[Twitch IRC] Closed (code ' + ev.code + ') — reconnecting...');
    setSourceState('twitch', 'Twitch', 'reconnecting…', false);
    scheduleReconnect('twitch', () => connectTwitch(channel));
  };
}

/* ═══════════════════════════════════════════════════════════
   19. KICK PUSHER WEBSOCKET
═══════════════════════════════════════════════════════════ */
async function connectKick(channel, directChatroomId = null) {
  setSourceState('kick', 'Kick', `connecting #${channel || directChatroomId}…`, false);

  let targetChatroomId = directChatroomId;

  if (!targetChatroomId && /^\d+$/.test(channel)) {
    targetChatroomId = channel;
  }

  const PUSHER_KEY = 'eb1d5f283081a78b932c';
  let ws;
  try {
    ws = new WebSocket(`wss://ws-us2.pusher.com/app/${PUSHER_KEY}?protocol=7&client=js&version=7.6.0&flash=false`);
  } catch (e) {
    setSourceState('kick', 'Kick', 'unavailable', false);
    return;
  }

  let connectionTimeout = setTimeout(() => {
    setSourceState('kick', 'Kick', 'timeout — retrying…', false);
    try { ws.close(); } catch {}
  }, 15000);

  ws.onopen = () => {
    clearTimeout(connectionTimeout);
    retryDelays.kick = 2000;
    const channelName = targetChatroomId ? `chatrooms.${targetChatroomId}.v2` : `channel.${channel}`;
    ws.send(JSON.stringify({ event: 'pusher:subscribe', data: { auth: '', channel: channelName } }));
    setSourceState('kick', 'Kick', `#${channel || targetChatroomId}`, true);
    guide.style.display = 'none';
  };

  ws.onmessage = ({ data: rawData }) => {
    try {
      const event = JSON.parse(rawData);

      if (event.event === 'pusher:ping') {
        ws.send(JSON.stringify({ event: 'pusher:pong', data: {} }));
        return;
      }

      const isKickChatMsg = (
        event.event === 'App\\Events\\ChatMessageEvent' ||
        event.event === 'ChatMessageEvent' ||
        event.event === 'chatroom.message' ||
        (event.event && event.event.toLowerCase().includes('chatmessage'))
      );

      if (isKickChatMsg) {
        const message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (!message) return;
        const user = message.sender?.username || message.user?.username || 'User';
        const avatarUrl = message.sender?.profile_picture || message.sender?.profile_picture_url || message.sender?.avatar || '';
        const textContent = message.content || message.message || message.text || '';
        const badges = [];
        const identity = message.sender?.identity || {};
        const senderBadges = identity.badges || message.sender?.badges || [];
        const isStreamer = message.sender?.is_broadcaster || senderBadges.some(b => b.type === 'broadcaster');
        const isMod = message.sender?.is_moderator || senderBadges.some(b => b.type === 'moderator');
        const isSub = message.sender?.is_subscribed || message.sender?.is_subscriber || senderBadges.some(b => b.type === 'subscriber');
        const isVip = senderBadges.some(b => b.type === 'vip');
        if (isStreamer) badges.push('broadcaster');
        if (isMod) badges.push('moderator');
        if (isSub) badges.push('subscriber');
        if (isVip) badges.push('vip');

        enqueueMessage({ user, text: textContent, badges, emotes: {}, platform: 'kick', avatarUrl });
      }
    } catch (e) {}
  };

  ws.onerror = () => {
    clearTimeout(connectionTimeout);
    setSourceState('kick', 'Kick', 'unavailable', false);
  };
  ws.onclose = () => {
    clearTimeout(connectionTimeout);
    setSourceState('kick', 'Kick', 'reconnecting…', false);
    scheduleReconnect('kick', () => connectKick(channel, targetChatroomId));
  };
}

/* ═══════════════════════════════════════════════════════════
   20. YOUTUBE DATA API V3
═══════════════════════════════════════════════════════════ */
async function connectYouTube(videoId, apiKey) {
  setSourceState('youtube', 'YouTube', 'connecting…', false);
  try {
    const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${encodeURIComponent(videoId)}&key=${encodeURIComponent(apiKey)}`);
    const data = await response.json().catch(() => ({}));
    const chatId = data.items?.[0]?.liveStreamingDetails?.activeLiveChatId;
    if (!chatId) {
      setSourceState('youtube', 'YouTube', 'no active live chat found', false);
      return;
    }

    retryDelays.youtube = 3000;
    setSourceState('youtube', 'YouTube', 'live chat active', true);
    guide.style.display = 'none';

    let pageToken = '';
    let stopped = false;

    async function poll() {
      if (stopped) return;
      try {
        const url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${encodeURIComponent(chatId)}&part=snippet,authorDetails&key=${encodeURIComponent(apiKey)}${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ''}`;
        const res = await fetch(url);
        const chatData = await res.json().catch(() => ({}));

        if (!res.ok || chatData.error) {
          const reason = chatData.error?.errors?.[0]?.reason || '';
          if (reason === 'quotaExceeded') {
            setSourceState('youtube', 'YouTube', 'API Quota Exceeded', false);
            return;
          }
          setSourceState('youtube', 'YouTube', 'API error / retrying', false);
          scheduleReconnect('youtube', () => connectYouTube(videoId, apiKey));
          return;
        }

        pageToken = chatData.nextPageToken || '';
        (chatData.items || []).forEach((item) => {
          const snippet = item.snippet || {};
          const author = item.authorDetails?.displayName || 'User';
          const message = item.snippet?.displayMessage || '';
          const avatarUrl = item.authorDetails?.profileImageUrl || '';
          const badges = [];
          if (item.authorDetails?.isChatOwner) badges.push('broadcaster');
          if (item.authorDetails?.isChatModerator) badges.push('moderator');
          if (item.authorDetails?.isChatSponsor) badges.push('yt-member');

          const eventType = String(snippet.type || '').toLowerCase();
          const superChat = snippet.superChatDetails || {};
          const milestone = snippet.memberMilestoneChatDetails || snippet.newSponsorDetails || snippet.giftMembershipReceivedDetails || snippet.membershipGiftingDetails || snippet.superStickerDetails || {};

          if (/superchat|supersticker/.test(eventType)) {
            enqueueMessage({
              user: author,
              platform: 'youtube',
              avatarUrl,
              isEvent: true,
              eventIcon: '💬',
              eventTitle: 'Super Chat',
              eventSubtitle: superChat.userComment || message || 'Super Chat sent!',
              eventMeta: [
                superChat.amountDisplayString ? { label: superChat.amountDisplayString, kind: 'amount' } : null,
                superChat.tier ? { label: `Tier ${superChat.tier}`, kind: 'tier' } : null,
              ].filter(Boolean),
              eventAmount: superChat.amountDisplayString || superChat.purchaseAmountText || '',
            });
            return;
          }

          if (/member|sponsor|gift/.test(eventType)) {
            enqueueMessage({
              user: author,
              platform: 'youtube',
              avatarUrl,
              isEvent: true,
              eventIcon: '🎖️',
              eventTitle: 'Membership Event',
              eventSubtitle: message || milestone.userComment || `${author} joined as a member!`,
              eventMeta: [
                milestone.memberLevelName ? { label: milestone.memberLevelName, kind: 'tier' } : null,
                milestone.months ? { label: `${milestone.months} months`, kind: 'count' } : null,
              ].filter(Boolean),
            });
            return;
          }

          enqueueMessage({ user: author, text: message, badges, emotes: {}, platform: 'youtube', avatarUrl });
        });

        const delay = Math.max(Number(chatData.pollingIntervalMillis || 4500), 3000);
        if (document.visibilityState === 'hidden') {
          const onVisible = () => {
            document.removeEventListener('visibilitychange', onVisible);
            reconnectTimers.youtube = setTimeout(poll, 1000);
          };
          document.addEventListener('visibilitychange', onVisible);
        } else {
          reconnectTimers.youtube = setTimeout(poll, delay);
        }
      } catch {
        setSourceState('youtube', 'YouTube', 'reconnecting…', false);
        scheduleReconnect('youtube', () => connectYouTube(videoId, apiKey));
      }
    }

    poll();
  } catch {
    setSourceState('youtube', 'YouTube', 'failed to connect', false);
  }
}

/* ═══════════════════════════════════════════════════════════
   21. POSTMESSAGE HANDLER (LIVE PREVIEW & TEST DECK SYNC)
═══════════════════════════════════════════════════════════ */
window.addEventListener('message', (event) => {
  const sameOrigin = event.origin === location.origin;
  const fileOrigin = event.origin === 'null' || location.origin === 'null';
  const allowedOrigin = sameOrigin || fileOrigin || event.origin === '';
  if (!allowedOrigin) return;

  const d = event.data;
  if (!d || typeof d !== 'object') return;
  if (MSG_SECRET && d.secret !== MSG_SECRET) return;

  // Handle clear
  if (d.kind === 'clear') {
    wrap.innerHTML = '';
    return;
  }

  // Handle test sound
  if (d.kind === 'test_sound') {
    playCue('twitch:message', d.profile || currentSoundProfile);
    return;
  }

  // Handle live config updates from index.html (NO RELOAD NEEDED)
  if (d.kind === 'config_update') {
    applyLiveConfigUpdate(d);
    return;
  }

  // Handle chat & event messages
  if (d.kind === 'chat' || d.kind === 'event') {
    enqueueMessage(d);
  }
});

function applyLiveConfigUpdate(config) {
  const body = document.body;
  const root = document.documentElement;

  // Update theme
  if (config.theme) {
    const allThemes = ['neon','fire','cyber','ocean','glass','minimal','rose','sunset','mono','valorant','tactical','stealth','magma','synthwave','matrix','frost','kawaii','hextech','floating','pure'];
    allThemes.forEach(t => body.classList.remove(`theme-${t}`));
    const resolvedTheme = THEME_ALIASES[config.theme] || config.theme;
    currentTheme = resolvedTheme;
    body.classList.add(`theme-${resolvedTheme}`);
  }

  // Update animation
  if (config.anim) {
    ['glitch','slide','pop','fade','float','zoom'].forEach(a => body.classList.remove(`anim-${a}`));
    currentAnim = config.anim;
    body.classList.add(`anim-${config.anim}`);
  }

  // Update position
  if (config.pos) {
    ['right','left','top-right','top-left'].forEach(p => body.classList.remove(`pos-${p}`));
    currentPos = config.pos;
    body.classList.add(`pos-${config.pos}`);
  }

  // Update font
  if (config.font !== undefined) {
    if (config.font && FONT_MAP[config.font]) {
      root.style.setProperty('--font-family', FONT_MAP[config.font]);
    } else {
      root.style.removeProperty('--font-family');
    }
  }

  // Update opacity
  if (config.opacity !== undefined) {
    const op = Math.min(1, Math.max(0, Number(config.opacity) / 100));
    root.style.setProperty('--card-opacity', op.toFixed(2));
    if (op === 0) body.classList.add('pure-floating');
    else body.classList.remove('pure-floating');
  }

  // Update font size
  if (config.fontSize !== undefined) {
    root.style.setProperty('--font-size', `${config.fontSize}px`);
  }

  // Update emote size
  if (config.emoteSize !== undefined) {
    root.style.setProperty('--emote-size', `${config.emoteSize}px`);
  }

  // Update body modifier classes
  if (config.stroke !== undefined) {
    config.stroke ? body.classList.add('has-text-stroke') : body.classList.remove('has-text-stroke');
  }
  if (config.avatars !== undefined) {
    config.avatars ? body.classList.remove('hide-avatars') : body.classList.add('hide-avatars');
  }
  if (config.timestamps !== undefined) {
    config.timestamps ? body.classList.remove('hide-timestamps') : body.classList.add('hide-timestamps');
  }
  if (config.badges !== undefined) {
    config.badges ? body.classList.remove('hide-badges') : body.classList.add('hide-badges');
  }
  if (config.dir !== undefined) {
    currentChatDir = config.dir;
    config.dir === 'down' ? body.classList.add('dir-down') : body.classList.remove('dir-down');
  }

  // Custom accent colors
  if (config.accent || config.accent2) {
    setAccentColors(config.accent, config.accent2);
  }
}
